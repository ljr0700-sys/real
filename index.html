<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real8 부동산 디지털 플랫폼</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body { background-color: #121212; color: white; font-family: 'Noto Sans KR', sans-serif; text-align: center; margin: 0; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #main-content { display: none; padding: 20px; }
        .login-btn { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #ffffff; color: #000; border-radius: 10px; font-weight: bold; border: none; }
        .header { background: #0056b3; padding: 25px; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Real8 플랫폼</h1>
        <p>회원가입 및 로그인을 위해 아래 버튼을 눌러주세요.</p>
        <button class="login-btn" onclick="googleLogin()">Google 계정으로 로그인</button>
    </div>

    <div id="main-content">
        <div class="header" id="user-display">접속 중...</div>
        <div style="background: #1e1e1e; padding: 30px; border-radius: 15px; border: 1px solid #333; max-width: 800px; margin: 0 auto; text-align: left;">
            <h2 style="color: #4caf50;">📜 부동산 자산 디지털 대장</h2>
            <p>로그인에 성공하셨습니다! 이제 플랫폼을 이용할 수 있습니다.</p>
        </div>
    </div>

    <script>
        // 정린님의 실제 프로젝트 설정값 (사진 정보와 대조 완료)
        const firebaseConfig = {
            apiKey: "AIzaSyDPDh41Coju7dojq3ATISTxJDIiypx8eA0", 
            authDomain: "real8-platform-8527b.firebaseapp.com",
            projectId: "real8-platform-8527b",
            storageBucket: "real8-platform-8527b.appspot.com",
            messagingSenderId: "268345819156",
            appId: "1:268345819156:web:b017ad50d8d4e06f029001"
        };

        firebase.initializeApp(firebaseConfig);

        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).then((result) => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('user-display').innerText = result.user.displayName + "님, 환영합니다!";
            }).catch((error) => {
                alert("인증 오류: " + error.message);
            });
        }
    </script>
</body>
</html>
